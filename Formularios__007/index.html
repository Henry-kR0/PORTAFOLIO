<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de DOM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="cuerpo">

    <main class="contenedor">

        <!-- Tarjeta Login -->
        <section class="Login-card" id="loginCard">

            <h1>Inicio de sesión</h1>

            <p class="Descripción">Ingrese sus credenciales para acceder al sistema</p>

            <!-- Formulario -->
            <form id="FormLogin">

                <!-- Usuario -->
                <div class="grupo">

                    <label for="Usuario">Usuario:</label>

                    <input type="text" id="Usuario" placeholder="Ingrese su usuario">

                    <small id="errorUsuario" class="error"></small>

                </div>

                <!-- Rol del usuario -->

                <h3>Rol</h3>
                 <select id="rol">
                     <option value="Invitado">Invitado</option>
                     <option value="Administrador">Administrador</option>
                     <option value="Estudiante">Estudiante</option>
                     <option value="Docente">Docente</option>

                </select>

                <!-- Contraseña -->
                <div class="grupo">

                    <label for="Clave">Contraseña:</label>

                    <input  type="password" id="Clave" placeholder="Ingrese su contraseña">
                    
                    <small id="errorClave" class="error"></small>

                </div>

                

                <!-- Mostrar contraseña -->
                <div class="opciones">

                    <label>
                        <input type="checkbox" id="MostrarClave">
                        Mostrar contraseña
                    </label>

                </div>

                <!-- Botón -->
                <button type="submit">
                    Ingresar datos
                </button>

                <p id="mensajeGeneral" class="mensaje"></p>

            </form>

        </section>

        <!-- Panel Bienvenida -->
        <section class="Panel oculto" id="panelBienvenida">

            <h2>Acceso concedido</h2>

            <p>
                Bienvenido/a 
                <strong id="nombreUsuario"></strong>
            </p>

            <button id="btnCerrarSesion">
                Cerrar sesión
            </button>

        </section>

    </main>

    <script src="scriptlogin.js"></script>

</body>
</html>
